name: forflicksakes
description: "ForFlickSakes: premium AI-assisted TV and film discovery for iOS and Android."
publish_to: 'none'
version: 1.0.0+9
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_native_splash:
  color: "#050309"
  image: assets/brand/ffs_icon.png
  android: true
  ios: true
  fullscreen: true

  android_12:
    color: "#050309"
    image: assets/brand/ffs_icon.png
    icon_background_color: "#050309"

  web: false





